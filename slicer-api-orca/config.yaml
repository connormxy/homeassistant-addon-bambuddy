name: "OrcaSlicer API (Bambuddy)"
version: "2.4.2.1"
slug: bambuddy_orcaslicer_api
description: "A headless OrcaSlicer API sidecar container for cloud-free slicing in Bambuddy."
url: "https://github.com/connormxy/homeassistant-addon-bambuddy"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
map:
  - share:rw
ports:
  3003/tcp: 3003
ports_description:
  3003/tcp: OrcaSlicer API Port (use this in Bambuddy settings)

healthcheck:
  enabled: true
  interval: 30s
  timeout: 5s
  retries: 3

image: "ghcr.io/connormxy/slicer-api-orca-{arch}"
