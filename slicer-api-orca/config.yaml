name: "Bambuddy Slicer API (OrcaSlicer) (DEV)"
version: "2.4.2.9-1"
slug: bambuddy_orca_slicer_api_dev
image: "ghcr.io/connormxy/slicer-api-orca-dev"
stage: experimental
description: "A headless OrcaSlicer sidecar container for cloud-independent slicing in Bambuddy. (DEV)"
url: "https://github.com/connormxy/homeassistant-addon-bambuddy#dev"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
map:
  - share:rw
ports:
  3003/tcp: 3003
ports_description:
  3003/tcp: OrcaSlicer API Port (use this in Bambuddy settings)

healthcheck:
  enabled: true
  interval: 30s
  timeout: 5s
  retries: 3
