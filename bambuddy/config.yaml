# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: "Bambuddy (DEV)"
version: "1.2.5.5"
slug: bambuddy-dev
stage: experimental
description: "Bambuddy is an offline-capable, standalone companion app for Bambu Lab 3D printers. (DEV)"
url: "https://github.com/connormxy/homeassistant-addon-bambuddy#dev"
image: "ghcr.io/connormxy/bambuddy"
arch:
  - aarch64
  - amd64
init: false
hassio_role: homeassistant
privileged:
  - NET_RAW
homeassistant_api: true
options:
  debug: false
  orcaslicer_api_url: "http://127.0.0.1:3003"
  bambu_studio_api_url: "http://127.0.0.1:3001"
  preferred_slicer: "bambu_studio"
  obico_ml_url: "http://127.0.0.1:3333"
schema:
  debug: bool
  orcaslicer_api_url: str?
  bambu_studio_api_url: str?
  preferred_slicer: list(bambu_studio|orcaslicer)?
  mfa_encryption_key: password?
  database_url: password?
  virtual_printer_pasv_address: str?
  obico_ml_url: str?
  bambuddy_external_roots: str?
map:
  - addon_config:rw
  - share:rw
services:
  - mqtt:want
host_network: true
webui: http://[HOST]:[PORT:8000]
watchdog: http://[HOST]:[PORT:8000]/health
