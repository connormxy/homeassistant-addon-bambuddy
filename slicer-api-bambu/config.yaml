name: "Bambu Studio API (Bambuddy)"
version: "02.07.01.62.5"
slug: bambuddy_bambu_studio_api
description: "A headless Bambu Studio sidecar container for cloud-independent slicing in Bambuddy."
url: "https://github.com/connormxy/homeassistant-addon-bambuddy"
image: "ghcr.io/connormxy/slicer-api-bambu"
arch:
  - amd64
startup: services
boot: auto
init: false
map:
  - share:rw
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: Bambu Studio API Port (use this in Bambuddy settings)

healthcheck:
  enabled: true
  interval: 30s
  timeout: 5s
  retries: 3

image: "ghcr.io/connormxy/slicer-api-bambu-{arch}"
