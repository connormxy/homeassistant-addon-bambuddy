name: "Bambu Studio API (Bambuddy) (DEV)"
version: "02.07.01.62.1"
slug: bambuddy_bambu_studio_api_dev
stage: experimental
description: "(DEV) A headless Bambu Studio API sidecar container for cloud-free slicing in Bambuddy."
url: "https://github.com/connormxy/homeassistant-addon-bambuddy#dev"
arch:
  - amd64
startup: services
boot: auto
init: false
map:
  - share:rw
ports:
  3001/tcp: 3001
ports_description:
  3001/tcp: Bambu Studio API Port (use this in Bambuddy settings)

healthcheck:
  enabled: true
  interval: 30s
  timeout: 5s
  retries: 3

image: "ghcr.io/connormxy/slicer-api-bambu-{arch}"
