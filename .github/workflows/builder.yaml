name: Builder

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.addon }} for ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        addon: ["bambuddy", "obico-ml-api", "slicer-api-bambu", "slicer-api-orca"]
        arch: ["aarch64", "amd64"]
        exclude:
          - addon: "slicer-api-bambu"
            arch: "aarch64"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Get Add-on Version
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^version: ' ${{ matrix.addon }}/config.yaml | awk '{print $2}' | tr -d '"'\''\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set platform
        id: platform
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            echo "platform=linux/arm64" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.arch }}" = "amd64" ]; then
            echo "platform=linux/amd64" >> $GITHUB_OUTPUT
          fi

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.addon }}
          platforms: ${{ steps.platform.outputs.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.addon }}-${{ matrix.arch }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.addon }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
          labels: |
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
