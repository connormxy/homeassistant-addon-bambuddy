name: Builder

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ${{ matrix.addon }} for ${{ matrix.arch }}
    strategy:
      matrix:
        addon: ["bambuddy", "obico-ml-api", "slicer-api-bambu", "slicer-api-orca"]
        arch: ["aarch64", "amd64"]
        exclude:
          # Bambu Studio only builds for amd64
          - addon: "slicer-api-bambu"
            arch: "aarch64"
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build add-on
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target ${{ matrix.addon }} \
            --image ghcr.io/${{ github.repository_owner }}/${{ matrix.addon }}-{arch} \
            --docker-hub ghcr.io
