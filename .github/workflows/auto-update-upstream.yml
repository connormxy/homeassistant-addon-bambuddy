name: Auto Update Upstream Slicer APIs

on:
  schedule:
    # Run every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering from the GitHub Actions tab

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to push commits back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run Upstream Check Script
        id: check
        run: python .github/scripts/check_upstream.py

      - name: Commit and Push Changes
        if: steps.check.outputs.update_triggered == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-bump Slicer API versions from upstream changes"
          git push
